<article class="metric-card" [attr.data-level]="level">
  <div class="metric-head">
    <span>{{ label }}</span>
    <span class="metric-icon" aria-hidden="true">
      @switch (icon) {
        @case ('temperature') {
          <svg viewBox="0 0 24 24">
            <path d="M10 14.8V5a2 2 0 1 1 4 0v9.8a4 4 0 1 1-4 0Z" />
            <path d="M12 7v10" />
          </svg>
        }
        @case ('speed') {
          <svg viewBox="0 0 24 24">
            <path d="M5.1 18a8 8 0 1 1 13.8 0" />
            <path d="m12 14 4-5" />
            <circle cx="12" cy="14" r="1.5" />
          </svg>
        }
        @case ('clock') {
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 8v4l3 2" />
          </svg>
        }
      }
    </span>
  </div>
  <p class="metric-value">
    <strong>{{ value | number: (integer ? '1.0-0' : '1.1-1') }}</strong>
    <span>{{ unit }}</span>
  </p>
  <div class="metric-detail">
    <span class="mini-line"><i></i></span>
    {{ detail }}
  </div>
</article>
